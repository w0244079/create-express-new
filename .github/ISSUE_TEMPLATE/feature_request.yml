# Suggest an option, a change to generated apps or another improvement
name: Feature request
description: Suggest a new option, a change to the apps it generates or another improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Generated apps stay small on purpose: everything beyond request logging, body parsing and
        static files is an option. A suggestion is most likely to be accepted when many Express
        apps need it and it is easy to get wrong by hand.
  - type: dropdown
    id: area
    attributes:
      label: What is it about?
      options:
        - A new command line option or wizard question
        - The code or config of generated apps
        - The wizard or command line itself
        - The documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: What you are trying to do, and what is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you suggest?
      description: >-
        For an option, include the command you would like to run and what the generated app would
        have: its files, dependencies and behaviour.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, including what you add to a generated app by hand today.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this
