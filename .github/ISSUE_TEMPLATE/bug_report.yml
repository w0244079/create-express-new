# Report a problem with the generator or with an app it generates
name: Bug report
description: Something in the generator, or in an app it generates, does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Do not report security vulnerabilities here: use
        [private vulnerability reporting](https://github.com/w0244079/create-express-new/security/advisories/new)
        instead.
  - type: dropdown
    id: where
    attributes:
      label: Where is the problem?
      options:
        - The generator (command line options, the wizard, writing files)
        - A generated app (its code, config, tests or dependencies)
        - The documentation
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or wizard answers
      description: >-
        The full command you ran. For the wizard, paste the "Equivalent command" it shows before
        creating the app, or list your answers.
      placeholder: pnpm create express-new@latest my-app --ts --helmet
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the full output or error message, and the steps after generating the app if there are any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: create-express-new version
      description: The output of `npx create-express-new --version`, or `express --version` for a global install.
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: v22.18.0
    validations:
      required: true
  - type: input
    id: package-manager
    attributes:
      label: Package manager and version
      description: The output of `pnpm --version` or `npm --version`.
      placeholder: pnpm 11.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Such as the terminal you use for a problem with the wizard, or a fix you have in mind.
