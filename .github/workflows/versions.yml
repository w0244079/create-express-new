name: versions

# Check the dependency versions used by generated apps (templates/versions.json),
# which Dependabot does not cover. Fails when a version is behind, is too new for
# generated apps to install, or a new major needs review; fix locally with
# `npm run versions -- --update`.

on:
  schedule:
  - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Check generated app versions
      run: npm run versions
