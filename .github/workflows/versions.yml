name: versions

# Check the dependency versions used by generated apps (templates/versions.json),
# which Dependabot does not cover. Fails when a version is behind or a new major
# needs review; fix locally with `npm run versions -- --update`.

on:
  schedule:
  - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Check generated app versions
      run: npm run versions
