name: ci

# Pull requests, and the commits that reach main. Not every push: a branch
# with a pull request would run twice, and a version tag would run the tests
# that the publish workflow already runs before publishing. Run it by hand
# for a branch without a pull request.

on:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        node-version:
        - 22
        - 24
        - 26

    name: Node.js ${{ matrix.node-version }} (${{ matrix.os }})

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}

    # the version generated apps install in their Dockerfile, as the tests
    # install generated apps with it
    - name: Read pnpm version
      id: pnpm
      shell: bash
      run: echo "version=$(node -p "require('./templates/versions.json').versions.pnpm.slice(1)")" >> "$GITHUB_OUTPUT"

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.pnpm.outputs.version }}

    - name: Install Node.js dependencies
      run: pnpm install --frozen-lockfile

    - name: List environment
      shell: bash
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"
        echo "pnpm@$(pnpm -v)"
        pnpm ls ||:

    - name: Run tests
      run: pnpm run test-ci

    - name: Lint code
      run: pnpm run lint

  # build and run the image generated by --docker, as the tests only check
  # the Dockerfile's contents
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: default
          args: ''
          pm: pnpm
        - name: TypeScript API
          args: --api --ts
          pm: pnpm
        - name: CommonJS
          args: --cjs
          pm: pnpm
        - name: npm
          args: --pm=npm
          pm: npm

    name: Docker (${{ matrix.name }})

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    # the versions the generated Dockerfile installs
    - name: Read pnpm and npm versions
      id: versions
      run: |
        echo "pnpm=$(node -p "require('./templates/versions.json').versions.pnpm.slice(1)")" >> "$GITHUB_OUTPUT"
        echo "npm=$(node -p "require('./templates/versions.json').versions.npm.slice(1)")" >> "$GITHUB_OUTPUT"

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.versions.outputs.pnpm }}

    - name: Install npm
      if: matrix.pm == 'npm'
      run: npm install -g "npm@${{ steps.versions.outputs.npm }}"

    - name: Install Node.js dependencies
      run: pnpm install --frozen-lockfile

    # installing creates the lockfile that the image installs from
    - name: Generate app
      run: |
        node bin/express-cli.js --docker --no-git ${{ matrix.args }} "$RUNNER_TEMP/app"
        cd "$RUNNER_TEMP/app"
        ${{ matrix.pm }} install

    - name: Build image
      run: docker build -t app "$RUNNER_TEMP/app"

    - name: Run image and wait for it to be healthy
      run: |
        docker run -d --name app -p 3000:3000 app

        # the first health check runs after the 30s interval
        for i in $(seq 60); do
          status=$(docker inspect -f '{{.State.Health.Status}}' app)
          echo "health: $status"
          [ "$status" = healthy ] && break
          [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
          sleep 2
        done

        [ "$status" = healthy ]
        curl -fsS http://localhost:3000/health

    - name: Show container logs
      if: always()
      run: docker logs app || true
