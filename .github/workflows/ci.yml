name: ci

on:
- pull_request
- push

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        node-version:
        - 22
        - 24
        - 26

    name: Node.js ${{ matrix.node-version }} (${{ matrix.os }})

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Node.js dependencies
      run: npm install

    # generated apps require pnpm by default, and the tests install them
    - name: Install pnpm
      shell: bash
      run: npm install -g "pnpm@$(node -p "require('./templates/versions.json').versions.pnpm.slice(1)")"

    - name: List environment
      shell: bash
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"
        echo "pnpm@$(pnpm -v)"
        npm -s ls ||:

    - name: Run tests
      run: npm run test-ci

    - name: Lint code
      run: npm run lint

  # build and run the image generated by --docker, as the tests only check
  # the Dockerfile's contents
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: default
          args: ''
          pm: pnpm
        - name: TypeScript API
          args: --api --ts
          pm: pnpm
        - name: CommonJS
          args: --cjs
          pm: pnpm
        - name: npm
          args: --pm=npm
          pm: npm

    name: Docker (${{ matrix.name }})

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Install Node.js dependencies
      run: npm install

    # the versions the generated Dockerfile installs
    - name: Install ${{ matrix.pm }}
      run: npm install -g "${{ matrix.pm }}@$(node -p "require('./templates/versions.json').versions['${{ matrix.pm }}'].slice(1)")"

    # installing creates the lockfile that the image installs from
    - name: Generate app
      run: |
        node bin/express-cli.js --docker --no-git ${{ matrix.args }} "$RUNNER_TEMP/app"
        cd "$RUNNER_TEMP/app"
        ${{ matrix.pm }} install

    - name: Build image
      run: docker build -t app "$RUNNER_TEMP/app"

    - name: Run image and wait for it to be healthy
      run: |
        docker run -d --name app -p 3000:3000 app

        # the first health check runs after the 30s interval
        for i in $(seq 60); do
          status=$(docker inspect -f '{{.State.Health.Status}}' app)
          echo "health: $status"
          [ "$status" = healthy ] && break
          [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
          sleep 2
        done

        [ "$status" = healthy ]
        curl -fsS http://localhost:3000/health

    - name: Show container logs
      if: always()
      run: docker logs app || true
