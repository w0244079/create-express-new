name: ci

on:
- pull_request
- push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
        - 22
        - 24
        - 26

    name: Node.js ${{ matrix.node-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Node.js dependencies
      run: npm install

    - name: List environment
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"
        npm -s ls ||:

    - name: Run tests
      run: npm run test-ci

    - name: Lint code
      run: npm run lint
