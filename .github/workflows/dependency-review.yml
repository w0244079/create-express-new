name: dependency review

# Fail a pull request, including Dependabot's, that adds a dependency with a
# known vulnerability or updates one to a vulnerable version. Covers
# package.json and the actions used by the workflows, not the versions of
# generated apps in templates/versions.json.

on:
- pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Review dependency changes
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        # development dependencies too, as the generator has a single runtime dependency
        fail-on-scopes: runtime, development
